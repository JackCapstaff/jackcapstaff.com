{% extends "base.html" %}
{% set title = "Login" %}
{% set subtitle = "Access your ensembles" %}

{% block content %}
  <div class="card scheduler-auth-card">
    {% if error %}
      <div class="small scheduler-error">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="{{ url_for('login_post') }}">
      <div class="scheduler-field">
        <label class="small">Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="scheduler-field">
        <label class="small">Password</label>
        <input type="password" name="password" required>
      </div>

      <ul class="actions scheduler-actions">
        <li>
        <button class="btn" type="submit">Login</button>
        </li>
        <li>
        <a class="btn secondary" href="{{ url_for('register_view') }}">Create account</a>
        </li>
      </ul>
      <div class="scheduler-help-link">
        <a href="{{ url_for('forgot_password_view') }}">Forgot your password?</a>
      </div>
    </form>
  </div>
{% endblock %}
