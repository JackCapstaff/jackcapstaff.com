{% extends "base.html" %}

{% block title %}Create News - Admin{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('manage_news') }}" class="btn btn-secondary">&larr; Back to News Management</a>
</div>

<div class="card">
    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Create News Item</h4>
    </div>
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">Title *</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="subtitle">Subtitle</label>
                <input type="text" class="form-control" id="subtitle" name="subtitle">
            </div>
            <div class="form-group">
                <label for="published_at">Publish Date/Time</label>
                <input type="datetime-local" class="form-control" id="published_at" name="published_at">
                <small class="form-text text-muted">Leave empty to publish immediately.</small>
            </div>
            <div class="form-group">
                <label for="content">Content *</label>
                <textarea class="form-control" id="content" name="content" rows="10" required></textarea>
            </div>
            <div class="form-group">
                <label>Feature Photo</label>
                <div class="d-flex align-items-center mb-2" style="gap: 0.5rem;">
                    <span class="text-muted" style="font-size: 0.9rem;">Upload a new file:</span>
                </div>
                <input type="file" class="form-control-file" id="news_photo" name="news_photo" accept="image/*">
                <input type="hidden" id="news_photo_url" name="news_photo_url">
                <div class="mt-2">
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-toggle="modal" data-target="#galleryPickerModal">
                        &#128247; Or choose from gallery
                    </button>
                </div>
                <div id="gallery-picker-preview" class="mt-2" style="display:none;">
                    <p class="text-muted mb-1" style="font-size:0.85rem;">Selected from gallery:</p>
                    <img id="gallery-picker-thumb" src="" alt="Selected" style="max-width: 180px; border-radius: 6px; border: 2px solid var(--brass-gold);">
                    <button type="button" class="btn btn-link btn-sm text-danger p-0 ml-2" id="gallery-picker-clear">Remove</button>
                </div>
            </div>
            <button type="submit" class="btn btn-success">Create News Item</button>
        </form>
    </div>
</div>

<!-- Gallery Picker Modal -->
<div class="modal fade" id="galleryPickerModal" tabindex="-1" role="dialog" aria-labelledby="galleryPickerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="galleryPickerModalLabel">Choose from Gallery</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
      </div>
      <div class="modal-body">
        <div id="gallery-picker-grid" class="row" style="max-height: 65vh; overflow-y: auto;">
          <div class="col-12 text-center text-muted py-4" id="gallery-picker-loading">Loading photos...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
    var loaded = false;
    $('#galleryPickerModal').on('show.bs.modal', function () {
        if (loaded) return;
        loaded = true;
        fetch('/admin/gallery/photos/json')
            .then(function(r){ return r.json(); })
            .then(function(photos) {
                var grid = document.getElementById('gallery-picker-grid');
                if (!photos.length) {
                    grid.innerHTML = '<div class="col-12 text-center text-muted py-4">No gallery photos found.</div>';
                    return;
                }
                grid.innerHTML = '';
                photos.forEach(function(p) {
                    var col = document.createElement('div');
                    col.className = 'col-6 col-md-3 col-lg-2 mb-3';
                    col.innerHTML = '<div class="gallery-pick-item" style="cursor:pointer;" data-url="' + p.url + '" title="' + (p.caption || '') + '">' +
                        '<img src="' + p.url + '" class="img-fluid rounded" style="height: 110px; width: 100%; object-fit: cover;">' +
                        (p.caption ? '<p class="text-muted mt-1 mb-0" style="font-size:0.75rem; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;">' + p.caption + '</p>' : '') +
                        '</div>';
                    col.querySelector('.gallery-pick-item').addEventListener('click', function() {
                        var url = this.dataset.url;
                        document.getElementById('news_photo_url').value = url;
                        document.getElementById('news_photo').value = '';
                        document.getElementById('gallery-picker-thumb').src = url;
                        document.getElementById('gallery-picker-preview').style.display = '';
                        $('#galleryPickerModal').modal('hide');
                    });
                    grid.appendChild(col);
                });
            })
            .catch(function() {
                document.getElementById('gallery-picker-grid').innerHTML = '<div class="col-12 text-center text-danger py-4">Failed to load gallery photos.</div>';
            });
    });
    document.getElementById('gallery-picker-clear').addEventListener('click', function() {
        document.getElementById('news_photo_url').value = '';
        document.getElementById('gallery-picker-preview').style.display = 'none';
        document.getElementById('gallery-picker-thumb').src = '';
    });
})();
</script>
{% endblock %}
