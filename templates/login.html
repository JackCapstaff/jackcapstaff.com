{% extends "base.html" %}

{% block page_title %}Jack Capstaff - Login{% endblock %}

{% block main_content %}
	<!-- Main -->
	<article id="main">
		<header>
			<h2>LOGIN</h2>
			<p>Access the admin panel</p>
		</header>

		<section class="wrapper style5">
			<div class="inner" style="max-width: 520px; margin: 0 auto;">
				<form method="POST" action="{{ url_for('login') }}">
					<input type="hidden" name="next" value="{{ next_page or '' }}" />
					<div class="fields">
						<div class="field">
							<label for="identifier">Email or Username</label>
							<input type="text" name="identifier" id="identifier" placeholder="Your email or username" required />
						</div>
						<div class="field">
							<label for="password">Password</label>
							<input type="password" name="password" id="password" placeholder="Your password" required />
						</div>
					</div>
					<ul class="actions">
						<li><input type="submit" value="Login" class="primary" /></li>
					</ul>
				</form>

				<hr />

				<p style="text-align: center; margin-top: 2rem;">
					Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
				</p>
			</div>
		</section>
	</article>
{% endblock %}
