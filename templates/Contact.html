{% extends "base.html" %}

{% block page_title %}Jack Capstaff - Contact{% endblock %}

{% block main_content %}
	<!-- Main -->
	<article id="main">
		<header>
			<h2>CONTACT</h2>
			<p>Get in touch</p>
		</header>

		<section class="wrapper style5">
			<div class="inner">
				<h3>Contact Form</h3>
				<form method="POST" action="{{ url_for('contact') }}">
					<div class="fields">
						<div class="field half">
							<label for="demo-name">Name</label>
							<input type="text" name="demo-name" id="demo-name" placeholder="Name" required />
						</div>
						<div class="field half">
							<label for="demo-email">Email</label>
							<input type="email" name="demo-email" id="demo-email" placeholder="Email" required />
						</div>
						<div class="field">
							<label for="demo-message">Message</label>
							<textarea name="demo-message" id="demo-message" placeholder="Enter your message" rows="6" required></textarea>
						</div>
						<div class="field">
							<input type="checkbox" id="demo-copy" name="demo-copy" />
							<label for="demo-copy">Send me a copy</label>
						</div>
					</div>
					<ul class="actions">
						<li><input type="submit" value="Send Message" class="primary" /></li>
						<li><input type="reset" value="Reset" /></li>
					</ul>
				</form>

				<hr style="margin: 3rem 0;" />

				<h3>Contact Information</h3>
				<div style="margin-top: 2rem;">
					<h4>Email</h4>
					<p><a href="mailto:jack@jackcapstaff.com">jack@jackcapstaff.com</a></p>

					<h4>Social Media</h4>
					<ul style="list-style: none; padding: 0;">
						<li><a href="https://www.facebook.com/JackCapstaffMD" target="_blank">Facebook</a></li>
						<li><a href="https://www.instagram.com/jack_capstaff/" target="_blank">Instagram</a></li>
					</ul>
				</div>
			</div>
		</section>
	</article>
{% endblock %}
