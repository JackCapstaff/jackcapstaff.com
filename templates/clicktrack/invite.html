  <title>Band invitation · Performance Studio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/clicktrack.css') }}">

<body>
  <main class="performance-invite">

    <p>Create an account or sign in to open your band's performance track.</p>

    </div>
  </main>
