<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click track presentation</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; }
    #presentation-player, #presentation-player iframe, #presentation-player video { width: 100%; height: 100%; border: 0; object-fit: contain; }
    #presentation-message { position: fixed; top: 0; left: 0; padding: 8px; background: #222; z-index: 1; }
    #presentation-message:empty { display: none; }
    #presentation-unlock { position: fixed; bottom: 12px; left: 12px; z-index: 1; padding: 10px; }
  </style>
</head>
<body>
  <div id="presentation-player"></div>
  <div id="presentation-message" role="status">Connecting to conductor…</div>
  <button type="button" id="presentation-unlock" hidden>Allow video playback</button>
  <script src="{{ url_for('static', filename='js/clicktrack-presentation.js') }}"></script>
</body>
</html>
