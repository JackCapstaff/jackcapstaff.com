<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Kitchen{% endblock %} · Kitchen</title>
  <style>
    :root{
      --bg:#0f141b; --panel:#1a222d; --panel2:#222d3a; --line:#2c3a4a;
      --text:#f3f6fa; --muted:#9fb0c3; --accent:#ff7a3c; --accent2:#36c17a;
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased; line-height:1.4;
    }
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1200px;margin:0 auto;padding:18px clamp(14px,3vw,32px) 60px}
    .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
    .topbar h1{font-size:clamp(22px,3.5vw,34px);margin:0;flex:1;min-width:200px}
    .btn{
      display:inline-flex;align-items:center;gap:8px;justify-content:center;
      background:var(--panel2);color:var(--text);border:1px solid var(--line);
      padding:12px 18px;border-radius:999px;font-size:clamp(15px,2vw,18px);
      font-weight:600;cursor:pointer;min-height:52px;transition:.12s;
    }
    .btn:hover{border-color:var(--accent)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1008}
    .btn.green{background:var(--accent2);border-color:var(--accent2);color:#04240f}
    .btn.ghost{background:transparent}
    .btn.small{min-height:42px;padding:8px 14px;font-size:15px}
    .btn.danger{background:transparent;border-color:#5a2a24;color:#ff8a72}
    .flash{padding:12px 16px;border-radius:12px;margin-bottom:12px;font-weight:600}
    .flash.success{background:#16351f;color:#9be7b4}
    .flash.danger{background:#3a1c18;color:#ffb0a0}
    .flash.warning{background:#3a3116;color:#ffdf9b}
    .muted{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
    .card{
      background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
      padding:20px;display:flex;flex-direction:column;gap:8px;min-height:130px;transition:.12s;
    }
    .card:hover{border-color:var(--accent);transform:translateY(-2px)}
    .card .day{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
    .card h3{margin:0;font-size:clamp(18px,2.2vw,22px)}
    .pill{display:inline-block;font-size:13px;background:var(--panel2);border:1px solid var(--line);
      padding:4px 10px;border-radius:999px;color:var(--muted)}
    label{display:block;font-weight:600;margin:14px 0 6px}
    input[type=text],input[type=number],textarea,select{
      width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
      border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;
    }
    textarea{min-height:90px;resize:vertical}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .row > *{flex:1;min-width:160px}
    footer.kf{margin-top:40px;color:var(--muted);font-size:13px;text-align:center}
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
    <footer class="kf">Private kitchen · not linked from the site</footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
