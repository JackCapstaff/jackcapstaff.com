{% extends "quiz/base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="quiz-card quiz-card--narrow">
  <h1>Change Password</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ quiz_csrf_token }}">
    <div class="form-group">
      <label for="current_password">Current password</label>
      <input type="password" id="current_password" name="current_password"
             autocomplete="current-password" required class="form-control" autofocus>
    </div>
    <div class="form-group">
      <label for="new_password">New password <span class="hint">(minimum 8 characters)</span></label>
      <input type="password" id="new_password" name="new_password"
             autocomplete="new-password" required minlength="8" class="form-control">
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirm new password</label>
      <input type="password" id="confirm_password" name="confirm_password"
             autocomplete="new-password" required class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Update Password</button>
    <a href="{{ url_for('quiz_main.index') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
