{% extends "base.html" %}

{% block page_title %}Jack Capstaff - Forgot Password{% endblock %}

{% block main_content %}
	<!-- Main -->
	<article id="main">
		<header>
			<h2>FORGOT PASSWORD</h2>
			<p>Reset your account password</p>
		</header>

		<section class="wrapper style5">
			<div class="inner" style="max-width: 520px; margin: 0 auto;">
				<form method="POST" action="{{ url_for('forgot_password') }}">
					<div class="fields">
						<div class="field">
							<label for="email">Email Address</label>
							<input type="email" name="email" id="email" placeholder="Your email address" required />
						</div>
					</div>
					<ul class="actions">
						<li><input type="submit" value="Send Reset Link" class="primary" /></li>
					</ul>
				</form>

				<hr />

				<p style="text-align: center; margin-top: 2rem;">
					Remember your password? <a href="{{ url_for('login') }}">Log in</a>
				</p>
			</div>
		</section>
	</article>
{% endblock %}
