{% extends "base.html" %}

{% block page_title %}Jack Capstaff - Reset Password{% endblock %}

{% block main_content %}
	<!-- Main -->
	<article id="main">
		<header>
			<h2>RESET PASSWORD</h2>
			<p>Create a new password for your account</p>
		</header>

		<section class="wrapper style5">
			<div class="inner" style="max-width: 520px; margin: 0 auto;">
				<form method="POST" action="{{ url_for('reset_password', token=token) }}">
					<div class="fields">
						<div class="field">
							<label for="password">New Password</label>
							<input type="password" name="password" id="password" placeholder="Enter a new password" required />
						</div>
						<div class="field">
							<label for="password_confirm">Confirm Password</label>
							<input type="password" name="password_confirm" id="password_confirm" placeholder="Confirm your password" required />
						</div>
					</div>
					<ul class="actions">
						<li><input type="submit" value="Reset Password" class="primary" /></li>
					</ul>
				</form>

				<hr />

				<p style="text-align: center; margin-top: 2rem;">
					<a href="{{ url_for('login') }}">Back to login</a>
				</p>
			</div>
		</section>
	</article>
{% endblock %}
