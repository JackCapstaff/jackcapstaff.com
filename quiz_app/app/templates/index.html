{% extends "quiz/base.html" %}

{% block title %}SQE Practice{% endblock %}

{% block content %}
<section class="hero" style="text-align:center; padding: 3rem 1rem;">
    <h1>SQE1 Practice</h1>
    <p>Blueprint-aligned practice questions for the Solicitors Qualifying Examination.</p>
    {% if not current_user.is_authenticated %}
        <div class="cta-buttons" style="margin-top:1.5rem;">
            <a href="{{ url_for('quiz_auth.login') }}" class="btn btn-primary">Log In</a>
        </div>
    {% else %}
        <div class="cta-buttons" style="margin-top:1.5rem;">
            <a href="{{ url_for('quiz_main.dashboard') }}" class="btn btn-primary">Go to Dashboard</a>
        </div>
    {% endif %}
</section>
{% endblock %}
